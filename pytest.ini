[pytest]
testpaths = tests
# Os testes de navegador (e2e) só rodam quando pedidos: pytest -m e2e
addopts = -m "not e2e"
markers =
    unit: testes unitários, sem banco e sem rede
    banco: testes de funções, triggers e restrições do PostgreSQL
    integracao: testes da aplicação com banco real
    e2e: testes de ponta a ponta, no navegador
    aceitacao: cenários de aceitação (Dado, Quando, Então)
